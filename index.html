<div class="theme-switcher">
  <button class="theme-btn active" data-theme="0">1</button>
  <button class="theme-btn" data-theme="1">2</button>
  <button class="theme-btn" data-theme="2">3</button>
  <button class="theme-btn" data-theme="3">4</button>
  <button class="theme-btn" data-theme="4">5</button>
</div>

<div class="bottom-left">
  <div class="views">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6m0 8a5 5 0 1 1 0-10 5 5 0 0 1 0 10m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5"/></svg>

  </div>
  <div class="divider"></div>
  <div class="volume">
    <svg id="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.536 8.464a5 5 0 0 1 0 7.072m2.828-9.9a9 9 0 0 1 0 12.728M5.586 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>

    <span class="modal-close" id="wechat-close">&times;</span>
    <img src="assets/000010.jpg" alt="WeChat QR" class="modal-qr">
    <p class="modal-caption">Отсканируй в WeChat</p>
  </div>
</div>

<audio id="music" loop></audio>
